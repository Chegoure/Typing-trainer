<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><touch></typing></title>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --surface2: #222222;
      --border: #2a2a2a;
      --text: #d4d4d4;
      --muted: #6b6b6b;
      --green: #3dd68c;
      --green-bright: #3dd68c;
      --error: #ef5e65;
      --cursor: #3dd68c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Consolas', 'Courier New', 'SF Mono', Monaco, monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem;
      line-height: 1.5;
    }

    h1 {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 2.5rem;
      color: #3dd68c;
      letter-spacing: 0.04em;
      /* text-transform: uppercase; */
    }

    .card {
      width: 100%;
      max-width: 780px;
    }

    #setup {
      display: block;
    }

    #setup.hidden {
      display: none;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    #sourceText {
      width: 100%;
      min-height: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.7;
      padding: 1rem 1.1rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      /* Firefox */
      scrollbar-width: thin;
      scrollbar-color: var(--border) var(--surface);
    }

    #sourceText:focus {
      border-color: var(--green);
    }

    #sourceText::placeholder {
      color: var(--muted);
    }

    /* WebKit (Chrome, Safari, Edge) — кастомный скролл в стиле темы */
    #sourceText::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    #sourceText::-webkit-scrollbar-track {
      background: var(--surface);
      border-radius: 4px;
    }

    #sourceText::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
      border: 2px solid var(--surface);
    }

    #sourceText::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    #sourceText::-webkit-scrollbar-corner {
      background: var(--surface);
    }

    .btn {
      margin-top: 1rem;
      background: var(--surface2);
      color: var(--green);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem 1.4rem;
      font-size: 0.9rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background: #2a2a2a;
      border-color: var(--green);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .setup-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .setup-actions .btn {
      margin-top: 1rem;
    }

    #practice {
      display: none;
    }

    #practice.active {
      display: block;
    }

    .stats {
      display: flex;
      gap: 1.75rem;
      margin-bottom: 1.75rem;
      font-size: 0.8rem;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .stats span strong {
      color: var(--green);
      font-weight: 500;
    }

    /* Верхняя строка — напечатанное (как на скрине) */
    .typed-line {
      background: var(--surface);
      border-radius: 4px;
      padding: 0.85rem 1.1rem;
      margin-bottom: 1.5rem;
      font-size: 1.31rem; /* +25% */
      line-height: 1.65;
      min-height: 3.1rem;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
    }

    .typed-line .correct {
      color: var(--green-bright);
    }

    .typed-line .error {
      color: var(--error);
      background: rgba(240, 113, 120, 0.15);
      border-radius: 2px;
    }

    .typed-line .caret {
      display: inline-block;
      width: 2.5px;
      height: 1.2em;
      background: var(--cursor);
      vertical-align: text-bottom;
      margin-left: 1px;
      box-shadow: 0 0 6px rgba(78, 201, 176, 0.5);
    }

    /* Эталонный текст — ~3 строки, при длинных строках скролл + курсор всегда в зоне видимости */
    .text-display {
      position: relative;
      background: var(--surface);
      border-radius: 4px;
      padding: 0.9rem 1.1rem;
      font-size: 1.31rem;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
      height: calc(1.31rem * 1.75 * 3 + 1.8rem);
      overflow: auto;
      margin-bottom: 1.25rem;
      user-select: none;
      scrollbar-width: thin;
      scrollbar-color: var(--border) var(--surface);
    }

    .text-display::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .text-display::-webkit-scrollbar-track {
      background: var(--surface);
      border-radius: 4px;
    }

    .text-display::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
      border: 2px solid var(--surface);
    }

    .text-display::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    .text-display::-webkit-scrollbar-corner {
      background: var(--surface);
    }

    .text-display .line {
      display: block;
      min-height: 1.75em;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .char {
      display: inline;
    }

    .char.correct {
      color: var(--green-bright);
    }

    .char.error {
      color: var(--error);
      background: rgba(240, 113, 120, 0.15);
      border-radius: 2px;
    }

    .char.pending {
      color: var(--muted);
    }

    .char.space {
      white-space: pre;
    }

    .char.tab {
      color: var(--muted);
      opacity: 0.65;
    }

    .cursor {
      position: absolute;
      width: 2px;
      height: 1.25em;
      background: var(--cursor);
      border-radius: 1px;
      pointer-events: none;
      transition: left 0.06s cubic-bezier(0.22, 1, 0.36, 1),
                  top 0.06s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 10;
      box-shadow: 0 0 8px rgba(78, 201, 176, 0.45);
      will-change: left, top;
    }

    #typingInput {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      height: 0;
      width: 0;
      border: none;
      padding: 0;
      resize: none;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      margin-top: 0;
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
    }

    .btn-secondary:hover {
      border-color: var(--muted);
      color: var(--text);
    }

    .done-message {
      display: none;
      text-align: center;
      padding: 1.25rem;
      background: rgba(61, 214, 140, 0.08);
      border: 1px solid rgba(61, 214, 140, 0.35);
      border-radius: 6px;
      margin-top: 1.25rem;
    }

    .done-message.show {
      display: block;
    }

    .done-message h2 {
      color: var(--green-bright);
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
    }

    .done-message p {
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* Режим «Дзен»: прячем лишнее, место сохраняем — блоки не прыгают */
    body.zen h1,
    body.zen .stats,
    body.zen .hint,
    body.zen .actions,
    body.zen .done-message {
      visibility: hidden;
      pointer-events: none;
    }

    #zenFab {
      display: none;
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 100;
      background: var(--surface2);
      color: var(--green);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.9rem;
      font-size: 0.8rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, opacity 0.2s;
      opacity: 0.7;
    }

    #zenFab:hover {
      opacity: 1;
      border-color: var(--green);
    }

    body.zen #zenFab {
      display: block;
    }
  </style>
</head>
<body>
  <h1>&lt;touch&gt;&lt;/typing&gt;</h1>

  <button type="button" id="zenFab" title="Выйти из дзена">Больше</button>

  <div class="card">
    <div id="setup">
      <label for="sourceText">Вставьте текст для тренировки</label>
      <textarea id="sourceText" placeholder="Wake up, Neo..."></textarea>
      <div class="setup-actions">
        <button class="btn" id="startBtn" disabled>Готово</button>
        <button type="button" class="btn" id="sampleBtn">Пример текста</button>
      </div>
    </div>

    <div id="practice">
      <div class="stats">
        <span>Скорость: <strong id="wpm">0</strong> зн/мин</span>
        <span>Точность: <strong id="accuracy">100</strong>%</span>
        <span>Ошибки: <strong id="errors">0</strong></span>
        <span>Прогресс: <strong id="progress">0</strong>%</span>
      </div>

      <!-- Верхняя строка: то, что уже напечатано -->
      <div class="typed-line" id="typedLine"><span class="caret" id="lineCaret"></span></div>

      <!-- Эталонный текст -->
      <div class="text-display" id="textDisplay">
        <div class="cursor" id="cursor"></div>
      </div>

      <textarea id="typingInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

      <div class="actions">
        <button class="btn btn-secondary" id="restartBtn">Заново</button>
        <button class="btn btn-secondary" id="newTextBtn">Новый текст</button>
        <button class="btn btn-secondary" id="cursorBlinkBtn" title="Мигание курсора">Курсор: статика</button>
        <button class="btn btn-secondary" id="zenBtn">Тишина</button>
      </div>

      <div class="done-message" id="doneMessage">
        <h2>Готово!</h2>
        <p>Вы успешно напечатали весь текст.</p>
      </div>
    </div>
  </div>

  <script>
    const sourceText = document.getElementById('sourceText');
    const startBtn = document.getElementById('startBtn');
    const setup = document.getElementById('setup');
    const practice = document.getElementById('practice');
    const textDisplay = document.getElementById('textDisplay');
    const typedLine = document.getElementById('typedLine');
    const lineCaret = document.getElementById('lineCaret');
    const typingInput = document.getElementById('typingInput');
    const cursor = document.getElementById('cursor');
    const wpmEl = document.getElementById('wpm');
    const accuracyEl = document.getElementById('accuracy');
    const errorsEl = document.getElementById('errors');
    const progressEl = document.getElementById('progress');
    const restartBtn = document.getElementById('restartBtn');
    const newTextBtn = document.getElementById('newTextBtn');
    const zenBtn = document.getElementById('zenBtn');
    const zenFab = document.getElementById('zenFab');
    const cursorBlinkBtn = document.getElementById('cursorBlinkBtn');
    const doneMessage = document.getElementById('doneMessage');
    const sampleBtn = document.getElementById('sampleBtn');

    let target = '';
    let position = 0;
    let errorCount = 0;
    let startedAt = null;
    let finished = false;
    let chars = [];
    let typedValue = '';

    const SAMPLE_TEXT = `<script setup>
import { ref, computed, onMounted } from 'vue';

const choice = ref(null);
const systemStatus = ref('Searching for Neo...');

const isMatrixReal = computed(() => {
  return choice.value === 'red' ? false : true;
});

const takePill = (color) => {
  choice.value = color;
  if (color === 'red') {
    systemStatus.value = 'Wake up, Neo... The Matrix has you.';
  } else {
    systemStatus.value = 'Back to the simulation. Enjoy your steak!';
  }
};

onMounted(() => {
  console.log('Follow the white rabbit...');
});
<\/script>

<template>
  <div class="matrix-terminal crt-effect">
    <h1>System Status: {{ systemStatus }}</h1>
    
    <div v-if="!choice" class="morpheus-choice">
      <p>Choose wisely. There is no turning back.</p>
      <button @click="takePill('red')" class="pill red-pill">Red Pill</button>
      <button @click="takePill('blue')" class="pill blue-pill">Blue Pill</button>
    </div>

    <div v-else :class="{ 'glitch-alert': !isMatrixReal }">
      <p v-if="isMatrixReal">Everything is fine. Ignorance is bliss.</p>
      <p v-else>Warning: There is no spoon! [0x000000]</p>
    </div>
  </div>
</template>

<style>
html, body {
  margin: 0;
  padding: 0;
  background-color: #000000 !important;
  overflow: hidden;
}
</style>

<style scoped>
.matrix-terminal {
  color: #33ff33;
  background-color: #000000;
  font-family: 'Courier New', Courier, monospace;
  padding: 42px;
  min-height: 100vh;
  text-shadow: 0 0 5px rgba(51, 255, 51, 0.7), 0 0 10px rgba(51, 255, 51, 0.5);
}

.crt-effect::before {
  content: " ";
  display: block;
  position: absolute;
  top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
  z-index: 2;
  background-size: 100% 4px, 6px 100%;
  pointer-events: none;
}

.glitch-alert {
  animation: shake 0.5s infinite;
}

.pill {
  margin: 10px;
  padding: 10px 20px;
  cursor: pointer;
  border: 2px solid #33ff33;
  background: transparent;
  color: #33ff33;
  text-shadow: 0 0 5px rgba(51, 255, 51, 0.8);
  box-shadow: inset 0 0 5px rgba(51, 255, 51, 0.4), 0 0 5px rgba(51, 255, 51, 0.4);
}
</style>
`;

    sourceText.addEventListener('input', () => {
      startBtn.disabled = !sourceText.value.trim();
    });

    sampleBtn.addEventListener('click', () => {
      sourceText.value = SAMPLE_TEXT;
      startBtn.disabled = false;
      sourceText.focus();
    });

    startBtn.addEventListener('click', () => {
      target = sourceText.value.replace(/\r/g, '');
      if (!target) return;
      startPractice();
    });

    // Индексы начала каждой строки в target
    let lineStarts = [];

    function buildLineStarts() {
      lineStarts = [0];
      for (let i = 0; i < target.length; i++) {
        if (target[i] === '\n') lineStarts.push(i + 1);
      }
    }

    function getLineIndex(pos) {
      let line = 0;
      for (let i = 0; i < lineStarts.length; i++) {
        if (lineStarts[i] <= pos) line = i;
        else break;
      }
      return line;
    }

    function startPractice() {
      setup.classList.add('hidden');
      practice.classList.add('active');
      doneMessage.classList.remove('show');
      finished = false;
      position = 0;
      errorCount = 0;
      startedAt = null;
      typedValue = '';
      chars = [];

      buildLineStarts();

      typingInput.value = '';
      typedLine.innerHTML = '';
      typedLine.appendChild(lineCaret);
      renderTextDisplay();
      typingInput.focus();
      updateStats();
      requestAnimationFrame(() => updateCursor());
    }

    // Рисуем только 3 строки вокруг текущей
    function renderTextDisplay() {
      const curLine = getLineIndex(position);
      const totalLines = lineStarts.length;
      let from = Math.max(0, curLine - 1);
      let to = Math.min(totalLines - 1, from + 2);
      // если в конце — сдвигаем окно назад, чтобы всегда 3 строки
      if (to - from < 2) {
        from = Math.max(0, to - 2);
      }

      // map: global index -> span (только видимые)
      chars = [];
      textDisplay.innerHTML = '';
      textDisplay.appendChild(cursor);

      for (let li = from; li <= to; li++) {
        const lineEl = document.createElement('div');
        lineEl.className = 'line';

        const start = lineStarts[li];
        const end = (li + 1 < lineStarts.length) ? lineStarts[li + 1] - 1 : target.length;
        // end указывает на \n или конец текста; символы строки: [start, end)

        for (let i = start; i < end; i++) {
          const span = document.createElement('span');
          const ch = target[i];
          span.className = 'char';

          if (i < typedValue.length) {
            span.classList.add(typedValue[i] === ch ? 'correct' : 'error');
          } else {
            span.classList.add('pending');
          }

          if (ch === ' ') {
            span.textContent = ' ';
            span.classList.add('space');
          } else if (ch === '\t') {
            span.textContent = ' →  ';
            span.classList.add('tab');
            span.title = 'Tab';
          } else {
            span.textContent = ch;
          }

          lineEl.appendChild(span);
          chars[i] = span; // индекс = позиция в target
        }

        // Пустая строка — всё равно нужен блок высоты
        if (end <= start) {
          lineEl.innerHTML = '&nbsp;';
        }

        textDisplay.appendChild(lineEl);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (!practice.classList.contains('active') || finished) return;

      if (document.activeElement !== typingInput) {
        typingInput.focus();
      }

      if (e.key === 'Tab') {
        e.preventDefault();
        handleTab();
        return;
      }

      if (e.key === 'Enter') {
        e.preventDefault();
        handleEnter();
        return;
      }

      if (e.key === 'Backspace') {
        e.preventDefault();
        if (typedValue.length > 0) {
          typedValue = typedValue.slice(0, -1);
          sync();
        }
        return;
      }
    });

    typingInput.addEventListener('input', () => {
      if (finished) return;
      const val = typingInput.value;
      typingInput.value = '';

      for (const ch of val) {
        if (typedValue.length >= target.length) break;
        appendChar(ch);
      }
    });

    // Enter: обычный \n, либо пустая/пробельная строка (пробелы/табы до \n)
    function handleEnter() {
      if (finished || typedValue.length >= target.length) return;
      if (!startedAt) startedAt = Date.now();

      const pos = typedValue.length;
      const expected = target[pos];

      if (expected === '\n') {
        typedValue += '\n';
        sync();
        return;
      }

      // Строка из одних пробелов/табов до перевода строки — съедаем всё и \n
      let i = pos;
      while (i < target.length && (target[i] === ' ' || target[i] === '\t')) {
        i++;
      }
      if (i < target.length && target[i] === '\n') {
        typedValue += target.slice(pos, i + 1);
        sync();
        return;
      }

      // Иначе просто \n (будет ошибка, если ожидался другой символ)
      typedValue += '\n';
      sync();
    }

    // Tab: если в эталоне \t — вставляем \t;
    // если пробелы (отступ) — «съедаем» всю группу пробелов подряд
    function handleTab() {
      if (finished || typedValue.length >= target.length) return;
      if (!startedAt) startedAt = Date.now();

      const pos = typedValue.length;
      const expected = target[pos];

      if (expected === '\t') {
        typedValue += '\t';
      } else if (expected === ' ') {
        let i = pos;
        while (i < target.length && target[i] === ' ') {
          typedValue += ' ';
          i++;
        }
      } else {
        typedValue += '\t';
      }
      sync();
    }

    function appendChar(ch) {
      if (finished || typedValue.length >= target.length) return;
      if (!startedAt) startedAt = Date.now();
      typedValue += ch;
      sync();
    }

    function sync() {
      position = typedValue.length;
      errorCount = 0;

      for (let i = 0; i < typedValue.length; i++) {
        if (typedValue[i] !== target[i]) errorCount++;
      }

      renderTextDisplay();
      renderTypedLine();
      requestAnimationFrame(() => updateCursor());
      updateStats();

      if (position >= target.length) {
        finished = true;
        doneMessage.classList.add('show');
      }
    }

    function renderTypedLine() {
      typedLine.innerHTML = '';

      // Показываем только текущую строку: от последнего \n до конца
      let start = typedValue.lastIndexOf('\n');
      start = start === -1 ? 0 : start + 1;

      for (let i = start; i < typedValue.length; i++) {
        const span = document.createElement('span');
        const expected = target[i];
        const ch = typedValue[i];

        // \n на текущей строке не рисуем — после Enter строка сразу очищается
        if (ch === '\n') continue;

        span.className = (ch === expected) ? 'correct' : 'error';

        if (ch === '\t') {
          span.textContent = ' →  ';
        } else if (ch === ' ') {
          span.textContent = ' ';
          span.style.whiteSpace = 'pre';
        } else {
          span.textContent = ch;
        }
        typedLine.appendChild(span);
      }
      typedLine.appendChild(lineCaret);
    }

    /** Прокручивает контейнер так, чтобы элемент был полностью в видимой области */
    function scrollCharIntoView(el) {
      if (!el || !textDisplay) return;
      const cRect = textDisplay.getBoundingClientRect();
      const eRect = el.getBoundingClientRect();
      const pad = 4;

      if (eRect.top < cRect.top + pad) {
        textDisplay.scrollTop -= (cRect.top + pad - eRect.top);
      } else if (eRect.bottom > cRect.bottom - pad) {
        textDisplay.scrollTop += (eRect.bottom - (cRect.bottom - pad));
      }

      if (eRect.left < cRect.left + pad) {
        textDisplay.scrollLeft -= (cRect.left + pad - eRect.left);
      } else if (eRect.right > cRect.right - pad) {
        textDisplay.scrollLeft += (eRect.right - (cRect.right - pad));
      }
    }

    function updateCursor() {
      const displayRect = textDisplay.getBoundingClientRect();

      // Ищем span для текущей позиции
      let targetEl = chars[position];
      let placeAtEnd = false;

      // Если стоим на \n или за концом строки — курсор в конце предыдущего символа / строки
      if (!targetEl) {
        if (position > 0 && chars[position - 1]) {
          targetEl = chars[position - 1];
          placeAtEnd = true;
        } else {
          // Начало пустой строки
          const lines = textDisplay.querySelectorAll('.line');
          const curLine = getLineIndex(position);
          const totalLines = lineStarts.length;
          let from = Math.max(0, curLine - 1);
          let to = Math.min(totalLines - 1, from + 2);
          if (to - from < 2) from = Math.max(0, to - 2);
          const localIdx = curLine - from;
          if (lines[localIdx]) {
            const lineEl = lines[localIdx];
            scrollCharIntoView(lineEl);
            const r = lineEl.getBoundingClientRect();
            const dr = textDisplay.getBoundingClientRect();
            cursor.style.left = (r.left - dr.left + textDisplay.scrollLeft + 4) + 'px';
            cursor.style.top = (r.top - dr.top + textDisplay.scrollTop) + 'px';
            cursor.style.display = 'block';
            return;
          }
          cursor.style.left = '1.1rem';
          cursor.style.top = '0.9rem';
          cursor.style.display = 'block';
          return;
        }
      }

      // Сначала прокручиваем символ в видимую область (длинные/перенесённые строки)
      scrollCharIntoView(targetEl);

      // После скролла пересчитываем координаты
      const r = targetEl.getBoundingClientRect();
      const dr = textDisplay.getBoundingClientRect();

      // Учитываем scrollLeft/scrollTop: getBoundingClientRect даёт viewport,
      // absolute-позиция внутри overflow-контейнера должна быть относительно его content box
      const left = placeAtEnd
        ? (r.right - dr.left + textDisplay.scrollLeft)
        : (r.left - dr.left + textDisplay.scrollLeft);
      const top = r.top - dr.top + textDisplay.scrollTop;

      cursor.style.left = left + 'px';
      cursor.style.top = top + 'px';
      cursor.style.display = 'block';
    }

    function updateStats() {
      const total = target.length || 1;
      progressEl.textContent = Math.min(100, Math.round((position / total) * 100));
      errorsEl.textContent = errorCount;

      const typed = position;
      const correct = Math.max(0, typed - errorCount);
      accuracyEl.textContent = typed === 0 ? 100 : Math.round((correct / typed) * 100);

      if (startedAt && typed > 0) {
        const minutes = (Date.now() - startedAt) / 60000;
        wpmEl.textContent = Math.round(typed / Math.max(minutes, 0.001));
      } else {
        wpmEl.textContent = '0';
      }
    }

    document.addEventListener('click', (e) => {
      if (practice.classList.contains('active') && !finished) {
        if (!e.target.closest('button')) {
          typingInput.focus();
        }
      }
    });

    restartBtn.addEventListener('click', () => {
      if (target) startPractice();
    });

    newTextBtn.addEventListener('click', () => {
      document.body.classList.remove('zen');
      practice.classList.remove('active');
      setup.classList.remove('hidden');
      sourceText.value = target;
      startBtn.disabled = !target.trim();
      sourceText.focus();
    });

    function toggleZen() {
      document.body.classList.toggle('zen');
      typingInput.focus();
      requestAnimationFrame(() => updateCursor());
    }

    zenBtn.addEventListener('click', toggleZen);
    zenFab.addEventListener('click', toggleZen);

    // Режим курсора: статика / мигание (общий таймер — оба синхронны)
    let cursorBlink = false;
    let caretVisible = true;
    let blinkTimer = null;

    function applyCaretOpacity() {
      const op = (!cursorBlink || caretVisible) ? '1' : '0';
      cursor.style.opacity = op;
      if (lineCaret) lineCaret.style.opacity = op;
    }

    function setCursorBlink(on) {
      cursorBlink = on;
      cursorBlinkBtn.textContent = on ? 'Курсор: мигание' : 'Курсор: статика';
      if (blinkTimer) {
        clearInterval(blinkTimer);
        blinkTimer = null;
      }
      if (on) {
        caretVisible = true;
        applyCaretOpacity();
        blinkTimer = setInterval(() => {
          caretVisible = !caretVisible;
          applyCaretOpacity();
        }, 530);
      } else {
        caretVisible = true;
        applyCaretOpacity();
      }
    }

    cursorBlinkBtn.addEventListener('click', () => {
      setCursorBlink(!cursorBlink);
      typingInput.focus();
    });

    window.addEventListener('resize', () => {
      if (practice.classList.contains('active')) updateCursor();
    });
  </script>
</body>
</html>
